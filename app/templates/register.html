{% extends "base.html" %}

{% block content %}
<div id="register-page">

    <div id="menu-grid">
        {% include "fragments/menu_grid.html" %}
    </div>

    <div id="bottom-bar">
        <div id="cart-area">
            <h3>Current Order</h3>
            <div id="cart">
                {% include "fragments/cart.html" %}
            </div>
        </div>

        <div id="actions">
            <button class="btn btn-warning"
                    hx-post="/cart/remove-last"
                    hx-target="#cart"
                    hx-swap="innerHTML">Remove Last</button>
            <button class="btn btn-danger"
                    hx-post="/cart/clear"
                    hx-target="#cart"
                    hx-swap="innerHTML">Clear All</button>
            <button class="btn btn-accent"
                    hx-post="/receipt/print-last"
                    hx-target="#toast-container"
                    hx-swap="innerHTML"
                    hx-disabled-elt="this"
                    hx-sync="this:drop">Print Receipt</button>
            <div class="action-spacer"></div>
            {% if printer_ready is not none %}
            <span class="printer-status {% if printer_ready %}ready{% else %}offline{% endif %}"
                  title="Printer {{ 'ready' if printer_ready else 'offline' }}">&#9210;</span>
            {% endif %}
            <a href="/admin/login" class="btn btn-system">Settings</a>
        </div>

        <div id="bottom-spacer"></div>

        <div id="total-area">
            <div id="total-button">
                {% include "fragments/total_button.html" %}
            </div>
            <div id="last-order" class="last-order-display">
                {% include "fragments/last_order.html" %}
            </div>
        </div>
    </div>

</div>
{% endblock %}
