{% if cart.is_empty %}
<button class="total-btn disabled" disabled>
    <span class="total-amount">0.00&nbsp;&euro;</span>
    <span class="total-label">Print Receipt</span>
</button>
{% else %}
<button class="total-btn active"
        id="finalize-btn"
        hx-post="/cart/finalize"
        hx-target="#cart"
        hx-swap="innerHTML"
        hx-disabled-elt="this"
        hx-sync="this:drop">
    <span class="total-amount">{{ "%.2f"|format(cart.total) }}&nbsp;&euro;</span>
    <span class="total-label">Print Receipt</span>
</button>
{% endif %}
